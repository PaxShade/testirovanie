<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Основы тестирования ПО</title>
  <link rel="icon" href="static/img/favicon.ico" type="image/x-icon">
  <!-- Шрифты Inter и JetBrains Mono и Tailwind CSS -->
  <link rel="stylesheet" href="static/css/fonts.css" />
  <script src="static/js/tailwindcss.3.4.17.js"></script>
  <script src="static/js/init.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- Шапка -->
  <header class="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/85 dark:bg-slate-900/85 backdrop-blur">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-white font-mono text-sm font-bold">QA</span>
          <h1 class="text-lg sm:text-xl font-bold tracking-tight">Основы тестирования ПО</h1>
        </div>
        <p id="student-meta" class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1"></p>
      </div>

      <div class="flex items-center gap-2">
        <a id="repo-link" href="#" target="_blank" rel="noopener noreferrer"
           class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55v-2.02c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.58.23 2.75.11 3.04.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.39-5.26 5.67.41.36.78 1.07.78 2.15v3.19c0 .31.21.66.79.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
          </svg>
          <span>GitHub</span>
        </a>

        <button id="theme-toggle" type="button" title="Переключить тему"
                class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
          <svg id="icon-sun" class="w-5 h-5 hidden dark:block text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364 6.364-1.414-1.414M7.05 7.05 5.636 5.636m12.728 0-1.414 1.414M7.05 16.95l-1.414 1.414M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/>
          </svg>
          <svg id="icon-moon" class="w-5 h-5 block dark:hidden text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 space-y-6">
    <!-- Сводка и прогресс -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
        <div class="text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400">Контрольных точек</div>
        <div id="stat-kts" class="mt-1 text-2xl font-bold">0</div>
      </div>
      <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
        <div class="text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400">Лабораторные работы</div>
        <div id="stat-labs" class="mt-1 text-2xl font-bold">0 / 0</div>
        <div class="mt-2 h-1.5 w-full rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
          <div id="progress-bar" class="h-full rounded-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
      <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
        <div class="text-xs font-medium uppercase tracking-wider text-slate-500 dark:text-slate-400">Файлов в навигаторе</div>
        <div id="stat-files" class="mt-1 text-2xl font-bold">0</div>
      </div>
    </section>

    <!-- Фильтры и поиск -->
    <section class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div id="kt-tabs" class="flex flex-wrap gap-2"></div>
      <div class="relative w-full sm:w-72">
        <input id="search-input" type="search" placeholder="Поиск по теме, файлу, тегу..."
               class="w-full pl-9 pr-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/>
        </svg>
      </div>
    </section>

    <!-- Контейнер контрольных точек -->
    <section id="content-container" class="space-y-6"></section>
  </main>

  <!-- Футер -->
  <footer class="max-w-5xl mx-auto px-4 sm:px-6 py-8 text-center text-xs text-slate-500 dark:text-slate-400 border-t border-slate-200 dark:border-slate-800 mt-10">
    ВИВТ · Информатика и вычислительная техника · 2026
  </footer>

  <!-- Модальное окно просмотра кода -->
  <div id="code-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4">
    <div class="w-full max-w-4xl max-h-[88vh] flex flex-col rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between gap-3 px-5 py-3.5 border-b border-slate-200 dark:border-slate-800">
        <div class="min-w-0">
          <h3 id="modal-filename" class="font-mono text-sm font-semibold truncate"></h3>
          <p id="modal-filepath" class="font-mono text-xs text-slate-500 dark:text-slate-400 truncate"></p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="modal-copy" type="button"
                  class="px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            Копировать
          </button>
          <a id="modal-github" href="#" target="_blank" rel="noopener noreferrer"
             class="px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white hover:bg-indigo-500 transition">
            На GitHub ↗
          </a>
          <button id="modal-close" type="button" aria-label="Закрыть"
                  class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            ✕
          </button>
        </div>
      </div>
      <div class="overflow-auto p-5 bg-slate-950 text-slate-100 flex-1">
        <pre class="text-xs sm:text-sm leading-relaxed"><code id="modal-code"></code></pre>
      </div>
    </div>
  </div>

  <!-- Модальное окно онлайн-просмотра отчётов (.docx) -->
  <div id="doc-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/70 backdrop-blur-sm p-3 sm:p-5">
    <div class="w-full max-w-5xl h-[90vh] flex flex-col rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between gap-3 px-5 py-3 border-b border-slate-200 dark:border-slate-800">
        <div class="min-w-0">
          <h3 id="doc-modal-title" class="text-sm font-semibold truncate"></h3>
          <p id="doc-modal-path" class="font-mono text-xs text-slate-500 dark:text-slate-400 truncate"></p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <a id="doc-modal-download" href="#" download
             class="px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            Скачать
          </a>
          <a id="doc-modal-external" href="#" target="_blank" rel="noopener noreferrer"
             class="px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white hover:bg-indigo-500 transition">
            В новой вкладке ↗
          </a>
          <button id="doc-modal-close" type="button" aria-label="Закрыть"
                  class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            ✕
          </button>
        </div>
      </div>
      <div class="relative flex-1 bg-slate-100 dark:bg-slate-950">
        <iframe id="doc-modal-iframe" class="w-full h-full border-0" title="Онлайн-просмотр отчёта"></iframe>
      </div>
      <div class="px-4 py-2 text-[11px] text-slate-500 dark:text-slate-400 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900">
        Просмотр через Microsoft Office Online работает после публикации файла в публичном репозитории GitHub.
      </div>
    </div>
  </div>

  <script src="static/js/main.js"></script>
</body>
</html>
